name: Deploy game to server

on:
  push:
    branches:
      - main
      - claude/practical-lamport-tm606n
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy game files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: |
            index.html
            styles.css
            src/**/*
          target: "/srv/www/p17"
          strip_components: 0

      - name: List deployed directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            ls -la /srv/www/p17
