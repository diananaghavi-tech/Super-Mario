name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript module syntax
        run: |
          set -e
          for f in $(find src -name '*.js'); do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Verify module imports resolve
        run: node .github/scripts/check-imports.js

      - name: Verify index.html references existing files
        run: node .github/scripts/check-html-refs.js
