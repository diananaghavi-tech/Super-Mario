<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Mario - Jump & Collect Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --panel-bg: rgba(10, 20, 40, 0.55);
    --panel-border: rgba(255, 255, 255, 0.18);
    --gold: #ffd700;
    --accent: #ff5b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #7fb8ff 0%, #4f7fe0 55%, #2c4fa8 100%);
  }
  #gameWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
  }
  #hud {
    width: 800px;
    max-width: 95vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    backdrop-filter: blur(4px);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .badge .icon { font-size: 20px; }
  .badge .value { color: var(--gold); }
  #hearts .heart { color: var(--accent); }
  #canvasWrap {
    position: relative;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 0 4px rgba(255,255,255,0.08);
  }
  canvas {
    background: linear-gradient(#5c94fc, #a8d8ff);
    border: 6px solid #402a13;
    border-radius: 10px;
    display: block;
    max-width: 95vw;
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5, 10, 25, 0.55);
    border-radius: 10px;
    backdrop-filter: blur(2px);
  }
  .overlay.visible { display: flex; }
  .card {
    background: linear-gradient(160deg, #1c2b4a, #101a30);
    border: 3px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 28px 36px;
    text-align: center;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: pop 0.25s ease-out;
    max-width: 90%;
  }
  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .card h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    margin: 0 0 14px;
    color: var(--gold);
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 1px;
  }
  .card p {
    margin: 6px 0;
    font-size: 16px;
    line-height: 1.5;
    opacity: 0.92;
  }
  .card .kbd {
    display: inline-block;
    background: #333;
    border: 1px solid #666;
    border-bottom-width: 3px;
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 13px;
    font-family: monospace;
    color: #fff;
    margin: 0 2px;
  }
  .card .big {
    font-size: 20px;
    margin-top: 4px;
  }
  #controls {
    color: #fff;
    text-shadow: 1px 1px 0 #000;
    font-size: 13px;
    text-align: center;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <div id="hud">
    <div class="badge"><span class="icon">⭐</span><span>Stars: <span class="value" id="starCount">0</span>/<span id="starTotal">0</span></span></div>
    <div class="badge" id="hearts"><span class="icon heart">❤</span><span>Lives: <span class="value" id="lives">3</span></span></div>
  </div>
  <div id="canvasWrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="titleOverlay" class="overlay visible">
      <div class="card">
        <h1>MINI MARIO</h1>
        <p>Jump across platforms, dodge the pits,<br>and collect every star before the flag.</p>
        <p><span class="kbd">&larr;</span><span class="kbd">&rarr;</span> or <span class="kbd">A</span><span class="kbd">D</span> to move &middot; <span class="kbd">Space</span> to jump</p>
        <p class="big">Press any key to start</p>
      </div>
    </div>
    <div id="msgOverlay" class="overlay">
      <div class="card">
        <h1 id="msgTitle">GAME OVER</h1>
        <p id="msgBody"></p>
        <p class="big">Press <span class="kbd">R</span> to restart</p>
      </div>
    </div>
  </div>
  <div id="controls">&larr; &rarr; or A/D to move &middot; Space / &uarr; / W to jump &middot; R to restart</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const starCountEl = document.getElementById('starCount');
const starTotalEl = document.getElementById('starTotal');
const livesEl = document.getElementById('lives');
const titleOverlay = document.getElementById('titleOverlay');
const msgOverlay = document.getElementById('msgOverlay');
const msgTitle = document.getElementById('msgTitle');
const msgBody = document.getElementById('msgBody');

const GRAVITY = 0.6;
const FRICTION = 0.8;
const MOVE_SPEED = 4;
const JUMP_FORCE = -12.5;

// World is wider than the canvas; camera scrolls horizontally.
const WORLD_WIDTH = 2400;
const GROUND_Y = 400;

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();

  if (gameState === 'title' && e.key.toLowerCase() !== 'r') {
    gameState = 'playing';
    titleOverlay.classList.remove('visible');
  }
  if (e.key.toLowerCase() === 'r') restart();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('click', () => {
  if (gameState === 'title') {
    gameState = 'playing';
    titleOverlay.classList.remove('visible');
  }
});

// ---- Level layout ----
// Platforms: x, y, width, height
const platforms = [
  { x: 0,    y: GROUND_Y, w: 500,  h: 50 },
  { x: 560,  y: GROUND_Y, w: 260,  h: 50 },
  { x: 900,  y: GROUND_Y, w: 400,  h: 50 },
  { x: 1380, y: GROUND_Y, w: 300,  h: 50 },
  { x: 1760, y: GROUND_Y, w: 640,  h: 50 },
  // floating platforms
  { x: 250,  y: 300, w: 100, h: 20 },
  { x: 620,  y: 260, w: 100, h: 20 },
  { x: 780,  y: 320, w: 90,  h: 20 },
  { x: 1000, y: 280, w: 110, h: 20 },
  { x: 1200, y: 220, w: 100, h: 20 },
  { x: 1450, y: 300, w: 100, h: 20 },
  { x: 1600, y: 240, w: 100, h: 20 },
  { x: 1900, y: 300, w: 120, h: 20 },
  { x: 2100, y: 250, w: 100, h: 20 },
];

// Gaps (pits) - defined as x ranges where there's no ground so falling = death
const pits = [
  { x1: 500, x2: 560 },
  { x1: 820, x2: 900 },
  { x1: 1300, x2: 1380 },
  { x1: 1680, x2: 1760 },
];

// Stars to collect
let stars = [
  { x: 280, y: 260, taken: false },
  { x: 650, y: 220, taken: false },
  { x: 810, y: 280, taken: false },
  { x: 1030, y: 240, taken: false },
  { x: 1230, y: 180, taken: false },
  { x: 1480, y: 260, taken: false },
  { x: 1630, y: 200, taken: false },
  { x: 1930, y: 260, taken: false },
  { x: 2130, y: 210, taken: false },
  { x: 2300, y: 350, taken: false },
];
starTotalEl.textContent = stars.length;

// Simple flagpole goal at the end
const goal = { x: 2350, y: 250, w: 20, h: 150 };

let camX = 0;
let gameState = 'title'; // title, playing, won, dead
let particles = [];

function createPlayer() {
  return {
    x: 40, y: 300, w: 28, h: 36,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1,
    starsCollected: 0,
    lives: 3,
    walkPhase: 0,
  };
}
let player = createPlayer();

function resetPlayerPosition(p) {
  p.x = 40; p.y = 300; p.vx = 0; p.vy = 0;
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnBurst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI * 2 / 10) * i;
    particles.push({
      x, y,
      vx: Math.cos(angle) * (1.5 + Math.random() * 1.5),
      vy: Math.sin(angle) * (1.5 + Math.random() * 1.5),
      life: 1,
      color,
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.03;
  }
  particles = particles.filter(p => p.life > 0);
}

function update() {
  if (gameState !== 'playing') { updateParticles(); return; }

  // Horizontal input
  let moving = false;
  if (keys['arrowleft'] || keys['a']) {
    player.vx -= 1;
    player.facing = -1;
    moving = true;
  }
  if (keys['arrowright'] || keys['d']) {
    player.vx += 1;
    player.facing = 1;
    moving = true;
  }
  player.vx *= FRICTION;
  if (Math.abs(player.vx) > MOVE_SPEED) player.vx = MOVE_SPEED * Math.sign(player.vx);

  if (moving && player.onGround) player.walkPhase += 0.35;

  // Jump
  if ((keys['arrowup'] || keys['w'] || keys[' ']) && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
  }

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  // Move horizontally then resolve collisions
  player.x += player.vx;
  player.onGround = false;

  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      // Resolve based on overlap direction (simple approach)
      const overlapLeft = (player.x + player.w) - p.x;
      const overlapRight = (p.x + p.w) - player.x;
      if (player.vx > 0 && overlapLeft < 20) {
        player.x = p.x - player.w;
      } else if (player.vx < 0 && overlapRight < 20) {
        player.x = p.x + p.w;
      }
    }
  }

  // Move vertically then resolve collisions
  player.y += player.vy;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) {
        // landing on top
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        // hit head
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // Fell into a pit or off the world -> lose a life
  const inPit = pits.some(pit => player.x + player.w/2 > pit.x1 && player.x + player.w/2 < pit.x2);
  if (player.y > 500 || (inPit && player.y > GROUND_Y)) {
    loseLife();
  }

  // World bounds
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

  // Star collection
  for (const s of stars) {
    if (!s.taken) {
      const starBox = { x: s.x - 12, y: s.y - 12, w: 24, h: 24 };
      if (rectsOverlap(player, starBox)) {
        s.taken = true;
        player.starsCollected++;
        starCountEl.textContent = player.starsCollected;
        spawnBurst(s.x - camX, s.y, '255, 215, 0');
      }
    }
  }

  // Goal check
  if (rectsOverlap(player, goal)) {
    winGame();
  }

  // Camera follows player, clamped to world
  camX = player.x - 300;
  if (camX < 0) camX = 0;
  if (camX > WORLD_WIDTH - canvas.width) camX = WORLD_WIDTH - canvas.width;

  updateParticles();
}

function loseLife() {
  player.lives--;
  livesEl.textContent = player.lives;
  if (player.lives <= 0) {
    gameState = 'dead';
    showMessage('GAME OVER', 'You ran out of lives. Stars collected: ' + player.starsCollected + '/' + stars.length);
  } else {
    resetPlayerPosition(player);
  }
}

function winGame() {
  gameState = 'won';
  showMessage('YOU WIN!', 'You reached the flag with ' + player.starsCollected + '/' + stars.length + ' stars.');
}

function showMessage(title, body) {
  msgTitle.textContent = title;
  msgBody.textContent = body;
  msgOverlay.classList.add('visible');
}
function hideMessage() {
  msgOverlay.classList.remove('visible');
}

function restart() {
  player = createPlayer();
  stars.forEach(s => s.taken = false);
  starCountEl.textContent = 0;
  livesEl.textContent = player.lives;
  particles = [];
  gameState = 'playing';
  titleOverlay.classList.remove('visible');
  hideMessage();
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#6fb2ff');
  grad.addColorStop(1, '#bfe4ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawMountains() {
  ctx.fillStyle = 'rgba(90, 110, 160, 0.45)';
  for (let i = 0; i < 5; i++) {
    const mx = (i * 420 - camX * 0.15) % (WORLD_WIDTH + 420) - 100;
    ctx.beginPath();
    ctx.moveTo(mx, GROUND_Y + 10);
    ctx.lineTo(mx + 110, GROUND_Y - 130);
    ctx.lineTo(mx + 220, GROUND_Y + 10);
    ctx.closePath();
    ctx.fill();
  }
}

function drawBackgroundHills() {
  ctx.fillStyle = '#4fa84a';
  for (let i = 0; i < 6; i++) {
    const hx = (i * 500 - camX * 0.3) % (WORLD_WIDTH + 500);
    ctx.beginPath();
    ctx.arc(hx, GROUND_Y + 40, 80, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = '#3d8f3a';
  for (let i = 0; i < 6; i++) {
    const hx = (i * 500 - camX * 0.3) % (WORLD_WIDTH + 500) + 60;
    ctx.beginPath();
    ctx.arc(hx, GROUND_Y + 55, 55, Math.PI, 0);
    ctx.fill();
  }
  // clouds
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 8; i++) {
    const cx = (i * 350 - camX * 0.5) % (WORLD_WIDTH + 350);
    const cy = 60 + (i % 3) * 30;
    drawCloud(cx, cy);
  }
}

function drawCloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.arc(x + 20, y - 8, 20, 0, Math.PI * 2);
  ctx.arc(x + 42, y, 18, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlatforms() {
  for (const p of platforms) {
    const drawX = p.x - camX;
    if (drawX + p.w < 0 || drawX > canvas.width) continue;
    // dirt block style with brick seams
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(drawX, p.y, p.w, p.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    for (let bx = 0; bx < p.w; bx += 24) {
      ctx.beginPath();
      ctx.moveTo(drawX + bx, p.y + 10);
      ctx.lineTo(drawX + bx, p.y + p.h);
      ctx.stroke();
    }
    ctx.fillStyle = '#5aa64c';
    ctx.fillRect(drawX, p.y, p.w, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(drawX, p.y, p.w, 3);
  }
}

function drawStar(x, y, taken, t) {
  if (taken) return;
  const drawX = x - camX;
  if (drawX < -30 || drawX > canvas.width + 30) return;
  const bob = Math.sin(t / 300 + x) * 4;
  const scale = 1 + Math.sin(t / 200 + x) * 0.12;
  ctx.save();
  ctx.translate(drawX, y + bob);
  ctx.scale(scale, scale);
  ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#c98e00';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
    const outerX = Math.cos(angle) * 12;
    const outerY = Math.sin(angle) * 12;
    const innerAngle = angle + Math.PI / 5;
    const innerX = Math.cos(innerAngle) * 5;
    const innerY = Math.sin(innerAngle) * 5;
    if (i === 0) ctx.moveTo(outerX, outerY);
    else ctx.lineTo(outerX, outerY);
    ctx.lineTo(innerX, innerY);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.color}, ${Math.max(p.life, 0)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGoalFlag() {
  const drawX = goal.x - camX;
  ctx.fillStyle = '#cccccc';
  ctx.fillRect(drawX, goal.y - goal.h + 20, 4, goal.h);
  ctx.beginPath();
  ctx.arc(drawX + 2, goal.y - goal.h + 18, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe066';
  ctx.fill();
  ctx.fillStyle = '#ff3b3b';
  const wave = Math.sin(Date.now() / 250) * 4;
  ctx.beginPath();
  ctx.moveTo(drawX + 4, goal.y - goal.h + 25);
  ctx.quadraticCurveTo(drawX + 20 + wave, goal.y - goal.h + 31, drawX + 34, goal.y - goal.h + 38);
  ctx.quadraticCurveTo(drawX + 20 + wave, goal.y - goal.h + 45, drawX + 4, goal.y - goal.h + 51);
  ctx.closePath();
  ctx.fill();
}

function drawPlayer() {
  const drawX = player.x - camX;
  const drawY = player.y;
  const squash = Math.max(-0.25, Math.min(0.25, player.vy / 30));
  ctx.save();
  ctx.translate(drawX + player.w / 2, drawY + player.h / 2);
  ctx.scale(player.facing * (1 - squash * 0.3), 1 + squash * 0.3);

  const legSwing = player.onGround ? Math.sin(player.walkPhase) * 6 : 0;

  // legs
  ctx.fillStyle = '#123c78';
  ctx.fillRect(-player.w/2 + 2, player.h/2 - 10, 8, 10 + legSwing * 0.3);
  ctx.fillRect(player.w/2 - 10, player.h/2 - 10, 8, 10 - legSwing * 0.3);

  // body (overalls)
  ctx.fillStyle = '#1a5fb4';
  ctx.fillRect(-player.w/2, -2, player.w, player.h/2 + 2);
  // shirt/arms
  ctx.fillStyle = '#c8102e';
  ctx.fillRect(-player.w/2, -player.h/2 + 6, player.w, 12);
  // head
  ctx.fillStyle = '#ffcf9e';
  ctx.fillRect(-player.w/2 + 4, -player.h/2 - 6, player.w - 8, 14);
  // hat
  ctx.fillStyle = '#c8102e';
  ctx.fillRect(-player.w/2 + 2, -player.h/2 - 10, player.w - 4, 6);
  // eye
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(4, -player.h/2 - 3, 3, 3);
  // mustache
  ctx.fillStyle = '#3b2313';
  ctx.fillRect(2, -player.h/2 - 1, 6, 3);

  ctx.restore();
}

function drawHUDVignette() {
  const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height/2.2, canvas.width/2, canvas.height/2, canvas.height);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function draw() {
  const t = Date.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawSky();
  drawMountains();
  drawBackgroundHills();
  drawPlatforms();
  stars.forEach(s => drawStar(s.x, s.y, s.taken, t));
  drawGoalFlag();
  drawPlayer();
  drawParticles();
  drawHUDVignette();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
